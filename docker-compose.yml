services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m backend.worker.run_sweep
    env_file: .env
    shm_size: '2gb'
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
    restart: unless-stopped
