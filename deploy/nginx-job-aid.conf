server {
    listen 80;
    server_name resolver.doxad.cloud;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name resolver.doxad.cloud;
    ssl_certificate /etc/letsencrypt/live/resolver.doxad.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resolver.doxad.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/job-aid.conf;
    location / { return 404; }
}
